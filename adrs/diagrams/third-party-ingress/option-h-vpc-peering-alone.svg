<text x="68" y="248" font-size="24" font-weight="700" fill="#172b4d">H1. Keep the existing passthrough NLB and remove the RP</text>
<text x="68" y="280" font-size="19" font-weight="400" fill="#526581">The producer frontend cannot attach native workload backends in the other VPC, even when peered.</text>
<text x="88" y="338" font-size="21" font-weight="700" fill="#172b4d">Shared third-party ingress VPC</text>
<text x="88" y="365" font-size="18" font-weight="400" fill="#526581">Same regional producer/backend network required</text>
<text x="1130" y="338" font-size="21" font-weight="700" fill="#172b4d">Intranet workload VPC</text>
<text x="1130" y="365" font-size="18" font-weight="400" fill="#526581">Peering does not change backend membership rules</text>
<rect x="92" y="394" width="260" height="142" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="116" y="424" font-size="20" font-weight="700" fill="#172b4d">PSC publication</text>
<text x="116" y="452" font-size="18" font-weight="400" fill="#526581">Service attachment</text>
<text x="116" y="474" font-size="18" font-weight="400" fill="#526581">Producer NAT subnet</text>
<rect x="400" y="394" width="292" height="142" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="424" y="424" font-size="20" font-weight="700" fill="#172b4d">Passthrough NLB</text>
<text x="424" y="452" font-size="18" font-weight="400" fill="#526581">Existing frontend type</text>
<text x="424" y="474" font-size="18" font-weight="400" fill="#526581">RP removed in proposal</text>
<rect x="1170" y="394" width="500" height="142" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1194" y="424" font-size="20" font-weight="700" fill="#172b4d">Native workload NEG / VM</text>
<text x="1194" y="452" font-size="18" font-weight="400" fill="#526581">Cross-VPC backend attachment is ineligible.</text>
<text x="1194" y="474" font-size="18" font-weight="400" fill="#526581">No valid application path is created.</text>
<text x="68" y="708" font-size="24" font-weight="700" fill="#172b4d">H2. Change to a supported internal TCP proxy NLB and add peering</text>
<text x="68" y="740" font-size="19" font-weight="400" fill="#526581">Hypothetical only: address-overlap feasibility is UNPROVEN; eligible backend ownership and firewall permission required.</text>
<text x="88" y="792" font-size="21" font-weight="700" fill="#172b4d">Shared ingress VPC</text>
<text x="88" y="819" font-size="18" font-weight="400" fill="#526581">Proxy-only sources are managed Envoy, not tagged RP VMs</text>
<text x="1210" y="792" font-size="21" font-weight="700" fill="#172b4d">Intranet workload VPC</text>
<text x="1210" y="819" font-size="18" font-weight="400" fill="#526581">Supported native backend placement</text>
<rect x="92" y="854" width="246" height="174" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="116" y="884" font-size="20" font-weight="700" fill="#172b4d">PSC + TCP proxy</text>
<text x="116" y="912" font-size="18" font-weight="400" fill="#526581">Regional TCP proxy</text>
<text x="116" y="934" font-size="18" font-weight="400" fill="#526581">NLB</text>
<text x="116" y="956" font-size="18" font-weight="400" fill="#526581">TCP termination, not</text>
<text x="116" y="978" font-size="18" font-weight="400" fill="#526581">TLS</text>
<rect x="382" y="854" width="266" height="174" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="406" y="884" font-size="20" font-weight="700" fill="#172b4d">Proxy-only subnet</text>
<text x="406" y="912" font-size="18" font-weight="400" fill="#526581">Backend connection</text>
<text x="406" y="934" font-size="18" font-weight="400" fill="#526581">source</text>
<text x="406" y="956" font-size="18" font-weight="400" fill="#526581">Destination: workload</text>
<text x="406" y="978" font-size="18" font-weight="400" fill="#526581">IP:port</text>
<rect x="698" y="854" width="276" height="174" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="722" y="884" font-size="20" font-weight="700" fill="#172b4d">Peering subnet route</text>
<text x="722" y="912" font-size="18" font-weight="400" fill="#526581">Regular subnet route wins.</text>
<text x="722" y="934" font-size="18" font-weight="400" fill="#526581">Broad PA static route loses.</text>
<rect x="1240" y="854" width="442" height="174" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1264" y="884" font-size="20" font-weight="700" fill="#172b4d">Workload endpoint</text>
<text x="1264" y="912" font-size="18" font-weight="400" fill="#526581">Direct peering path can connect.</text>
<text x="1264" y="934" font-size="18" font-weight="400" fill="#526581">No Palo inspection on this shown path.</text>
<rect x="710" y="1094" width="350" height="126" rx="12" fill="#fff7e8" stroke="#cad4e1" stroke-width="1.5"/>
<text x="734" y="1124" font-size="20" font-weight="700" fill="#172b4d">Existing regional PA paths</text>
<text x="734" y="1152" font-size="18" font-weight="400" fill="#526581">Ordinary 10.0.0.0/8 route</text>
<text x="734" y="1174" font-size="18" font-weight="400" fill="#526581">Not selected for matched peer subnet</text>
<rect x="92" y="1094" width="574" height="126" rx="12" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="116" y="1124" font-size="20" font-weight="700" fill="#172b4d">Return routing remains confirmed</text>
<text x="116" y="1152" font-size="18" font-weight="400" fill="#526581">This rejection is about forward insertion.</text>
<text x="116" y="1174" font-size="18" font-weight="400" fill="#526581">Peering alone does not inherit the RP-tagged regional PA</text>
<text x="116" y="1196" font-size="18" font-weight="400" fill="#526581">selection.</text>
<rect x="1100" y="1094" width="582" height="126" rx="12" fill="#fff7e8" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1124" y="1124" font-size="20" font-weight="700" fill="#172b4d">Health is not inspection proof</text>
<text x="1124" y="1152" font-size="18" font-weight="400" fill="#526581">Native VM probes use Google special paths.</text>
<text x="1124" y="1174" font-size="18" font-weight="400" fill="#526581">Healthy backends do not establish PA transit.</text>
<rect x="44" y="1302" width="830" height="328" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="68" y="1332" font-size="20" font-weight="700" fill="#172b4d">Capacity is coupled, not universally halved</text>
<text x="68" y="1360" font-size="18" font-weight="400" fill="#526581">Applicable peering-group quotas count local and direct-peer resources. Examples include subnet</text>
<text x="68" y="1382" font-size="18" font-weight="400" fill="#526581">ranges and static/dynamic routes.</text>
<text x="68" y="1404" font-size="18" font-weight="400" fill="#526581">Equal-limit illustration only: two standalone budgets of N can become one combined effective</text>
<text x="68" y="1426" font-size="18" font-weight="400" fill="#526581">budget of N. An equal allocation is N/2 each, not an enforced split.</text>
<text x="68" y="1448" font-size="18" font-weight="400" fill="#526581">VM-instance and alias-IP peering-group quotas are deprecated; those quotas remain per-network.</text>
<text x="68" y="1470" font-size="18" font-weight="400" fill="#526581">Actual limits and usage were not read.</text>
<rect x="902" y="1302" width="854" height="328" rx="12" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="926" y="1332" font-size="20" font-weight="700" fill="#172b4d">H0 comes first: is peering feasible at all?</text>
<text x="926" y="1360" font-size="18" font-weight="400" fill="#526581">Actual subnet ranges and existing imported peering routes have NOT been audited. Overlap is a</text>
<text x="926" y="1382" font-size="18" font-weight="400" fill="#526581">potential hard blocker, not a confirmed conflict.</text>
<text x="926" y="1404" font-size="18" font-weight="400" fill="#526581">Check primary and secondary private IPv4 ranges, including GKE Pod/Service ranges. Matching or</text>
<text x="926" y="1426" font-size="18" font-weight="400" fill="#526581">contained subnet ranges can prevent peering.</text>
<text x="926" y="1448" font-size="18" font-weight="400" fill="#526581">Private IPv4 subnet routes are always exchanged. Disabling custom-route exchange does not hide</text>
<text x="926" y="1470" font-size="18" font-weight="400" fill="#526581">conflicts; peering adds no NAT.</text>
<text x="926" y="1492" font-size="18" font-weight="400" fill="#526581">If feasible, peering still adds no inspection or RP functions. Packet source: PSC NAT frontend leg,</text>
<text x="926" y="1514" font-size="18" font-weight="400" fill="#526581">proxy-only IP backend leg; database TLS can pass unchanged.</text>
<text x="926" y="1536" font-size="18" font-weight="400" fill="#526581">Pattern repeats in us-central1 and the second region; no deployment is asserted.</text>
<text x="44" y="1716" font-size="17" font-weight="400" fill="#526581">GCP third-party ingress | Reverse proxy removal | Architecture options | 2026-10-12</text>
<text x="44" y="64" font-size="34" font-weight="700" fill="#172b4d">H / VPC peering alone is not an RP replacement</text>
<text x="44" y="104" font-size="21" font-weight="400" fill="#526581">Peering provides reachability, not backend eligibility, mandatory Palo insertion or independent quota headroom.</text>
<rect x="44" y="126" width="784.578125" height="30" rx="6" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="57" y="147" font-size="17" font-weight="700" fill="#172b4d">REJECTED AS A STANDALONE FIX / NOT A CLAIM THAT PEERING CANNOT CONNECT VPCS</text>
<text x="116" y="187" font-size="18" font-weight="400" fill="#526581">Application traffic</text>
<text x="512" y="187" font-size="18" font-weight="400" fill="#526581">Return traffic</text>
<text x="902" y="187" font-size="18" font-weight="400" fill="#526581">Native health checks</text>
<text x="1312" y="187" font-size="18" font-weight="400" fill="#526581">Resource / policy reference</text>
<path d="M 915,444 L 939,468 M 915,468 L 939,444" fill="none" stroke="#b23b39" stroke-width="5"/>
