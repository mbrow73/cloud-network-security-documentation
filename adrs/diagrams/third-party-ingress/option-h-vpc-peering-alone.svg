<text x="770" y="428" font-size="18" font-weight="400" fill="#b23b39">REJECTED backend reference</text>
<rect x="777" y="512" width="284.71875" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="785" y="530" font-size="18" font-weight="400" fill="#b23b39">VPC peering != backend eligibility</text>
<rect x="997" y="881" width="113.34375" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1005" y="899" font-size="18" font-weight="400" fill="#b23b39">PA BYPASS</text>
<path d="M 824,1037 L 848,1061 M 824,1061 L 848,1037" fill="none" stroke="#b23b39" stroke-width="5"/>
