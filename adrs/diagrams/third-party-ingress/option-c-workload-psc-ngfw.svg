<text x="64" y="234" font-size="21" font-weight="700" fill="#172b4d">Third-party VPCs</text>
<text x="64" y="261" font-size="18" font-weight="400" fill="#526581">PSC endpoint consumers</text>
<text x="384" y="234" font-size="21" font-weight="700" fill="#172b4d">Intranet workload VPC becomes the producer</text>
<text x="384" y="261" font-size="18" font-weight="400" fill="#526581">New service attachment and passthrough frontend in the same VPC as native workload backends</text>
<rect x="68" y="389" width="246" height="183" rx="12" fill="#eef4fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="92" y="419" font-size="20" font-weight="700" fill="#172b4d">Client + PSC</text>
<text x="92" y="443" font-size="20" font-weight="700" fill="#172b4d">endpoint</text>
<text x="92" y="471" font-size="18" font-weight="400" fill="#526581">MariaDB TCP client</text>
<text x="92" y="493" font-size="18" font-weight="400" fill="#526581">Consumer migration to</text>
<text x="92" y="515" font-size="18" font-weight="400" fill="#526581">the new publication</text>
<rect x="388" y="389" width="286" height="183" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="412" y="419" font-size="20" font-weight="700" fill="#172b4d">PSC service attachment</text>
<text x="412" y="447" font-size="18" font-weight="400" fill="#526581">Producer-side NAT</text>
<text x="412" y="469" font-size="18" font-weight="400" fill="#526581">Regional NAT subnet</text>
<text x="412" y="491" font-size="18" font-weight="400" fill="#526581">New publication boundary</text>
<rect x="721" y="389" width="363" height="183" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="745" y="419" font-size="20" font-weight="700" fill="#172b4d">Internal passthrough NLB</text>
<text x="745" y="447" font-size="18" font-weight="400" fill="#526581">Frontend and native backends share</text>
<text x="745" y="469" font-size="18" font-weight="400" fill="#526581">this VPC.</text>
<text x="745" y="491" font-size="18" font-weight="400" fill="#526581">No RP or Envoy backend connection.</text>
<text x="1160" y="317" font-size="21" font-weight="700" fill="#172b4d">Protected workload zone A</text>
<text x="1160" y="344" font-size="18" font-weight="400" fill="#526581">Repeat endpoint coverage for every protected workload zone</text>
<rect x="1164" y="373" width="250" height="114" rx="12" fill="#f6f0fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1188" y="403" font-size="20" font-weight="700" fill="#172b4d">NIC interception</text>
<text x="1188" y="431" font-size="18" font-weight="400" fill="#526581">Matching policy action</text>
<rect x="1452" y="373" width="250" height="114" rx="12" fill="#eef8f5" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1476" y="403" font-size="20" font-weight="700" fill="#172b4d">VM / pod endpoint</text>
<text x="1476" y="431" font-size="18" font-weight="400" fill="#526581">MariaDB or TCP service</text>
<rect x="1164" y="524" width="538" height="92" rx="12" fill="#f6f0fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1188" y="554" font-size="20" font-weight="700" fill="#172b4d">Zonal NGFW Enterprise endpoint</text>
<text x="1188" y="582" font-size="18" font-weight="400" fill="#526581">Policy-directed inspection, not a static next hop</text>
<text x="1160" y="733" font-size="21" font-weight="700" fill="#172b4d">Protected workload zone B</text>
<text x="1160" y="760" font-size="18" font-weight="400" fill="#526581">Repeat endpoint coverage for every protected workload zone</text>
<rect x="1164" y="789" width="250" height="114" rx="12" fill="#f6f0fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1188" y="819" font-size="20" font-weight="700" fill="#172b4d">NIC interception</text>
<text x="1188" y="847" font-size="18" font-weight="400" fill="#526581">Matching policy action</text>
<rect x="1452" y="789" width="250" height="114" rx="12" fill="#eef8f5" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1476" y="819" font-size="20" font-weight="700" fill="#172b4d">VM / pod endpoint</text>
<text x="1476" y="847" font-size="18" font-weight="400" fill="#526581">MariaDB or TCP service</text>
<rect x="1164" y="940" width="538" height="92" rx="12" fill="#f6f0fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1188" y="970" font-size="20" font-weight="700" fill="#172b4d">Zonal NGFW Enterprise endpoint</text>
<text x="1188" y="998" font-size="18" font-weight="400" fill="#526581">Policy-directed inspection, not a static next hop</text>
<rect x="388" y="686" width="696" height="212" rx="12" fill="#f6f0fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="412" y="716" font-size="20" font-weight="700" fill="#172b4d">Global / hierarchical policy + security profile</text>
<text x="412" y="744" font-size="18" font-weight="400" fill="#526581">Target the protected workload interfaces.</text>
<text x="412" y="766" font-size="18" font-weight="400" fill="#526581">Effective action: apply_security_profile_group</text>
<text x="412" y="788" font-size="18" font-weight="400" fill="#526581">Associate the endpoint in each workload zone.</text>
<text x="412" y="810" font-size="18" font-weight="400" fill="#526581">Regional network policies do not support this action.</text>
<rect x="44" y="1167" width="545" height="245" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="68" y="1197" font-size="20" font-weight="700" fill="#172b4d">Packet tuple at the workload</text>
<text x="68" y="1225" font-size="18" font-weight="400" fill="#526581">Source: producer PSC NAT subnet address.</text>
<text x="68" y="1247" font-size="18" font-weight="400" fill="#526581">Destination: passthrough forwarding-rule VIP.</text>
<text x="68" y="1269" font-size="18" font-weight="400" fill="#526581">Target: the correct workload NIC / secure tag.</text>
<text x="68" y="1291" font-size="18" font-weight="400" fill="#526581">Do not match the original consumer address or assume the</text>
<text x="68" y="1313" font-size="18" font-weight="400" fill="#526581">VM primary destination.</text>
<rect x="617" y="1167" width="545" height="245" rx="12" fill="#fff7e8" stroke="#cad4e1" stroke-width="1.5"/>
<text x="641" y="1197" font-size="20" font-weight="700" fill="#172b4d">Health and database behavior</text>
<text x="641" y="1225" font-size="18" font-weight="400" fill="#526581">Native NLB health checks still need firewall permission.</text>
<text x="641" y="1247" font-size="18" font-weight="400" fill="#526581">A TCP probe is not a successful authenticated query.</text>
<text x="641" y="1269" font-size="18" font-weight="400" fill="#526581">For writes, backend eligibility must follow the database role</text>
<text x="641" y="1291" font-size="18" font-weight="400" fill="#526581">and failover design.</text>
<rect x="1190" y="1167" width="566" height="245" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1214" y="1197" font-size="20" font-weight="700" fill="#172b4d">TLS visibility</text>
<text x="1214" y="1225" font-size="18" font-weight="400" fill="#526581">PSC and passthrough do not decrypt.</text>
<text x="1214" y="1247" font-size="18" font-weight="400" fill="#526581">NGFW payload visibility requires compatible TLS inspection and</text>
<text x="1214" y="1269" font-size="18" font-weight="400" fill="#526581">client trust.</text>
<text x="1214" y="1291" font-size="18" font-weight="400" fill="#526581">Validate MariaDB handshake, TLS mode, pinning and client</text>
<text x="1214" y="1313" font-size="18" font-weight="400" fill="#526581">authentication.</text>
<rect x="44" y="1444" width="835" height="330" rx="12" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="68" y="1474" font-size="20" font-weight="700" fill="#172b4d">What moves and who owns it</text>
<text x="68" y="1502" font-size="18" font-weight="400" fill="#526581">Move service publication from the ingress VPC to the workload VPC.</text>
<text x="68" y="1524" font-size="18" font-weight="400" fill="#526581">Create the new regional service attachment / frontend and plan consumer cutover.</text>
<text x="68" y="1546" font-size="18" font-weight="400" fill="#526581">Service-attachment target replacement cannot be used to move it across VPCs.</text>
<text x="68" y="1568" font-size="18" font-weight="400" fill="#526581">Assign owners for zonal endpoints, policy, certificates, logs and database health.</text>
<text x="68" y="1590" font-size="18" font-weight="400" fill="#526581">Repeat the producer / protection setup for each required service region.</text>
<rect x="907" y="1444" width="849" height="330" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="931" y="1474" font-size="20" font-weight="700" fill="#172b4d">What must be accepted</text>
<text x="931" y="1502" font-size="18" font-weight="400" fill="#526581">Cloud NGFW replaces the routed Palo control point for this traffic.</text>
<text x="931" y="1524" font-size="18" font-weight="400" fill="#526581">Map actual Panorama profiles and exceptions to supported controls.</text>
<text x="931" y="1546" font-size="18" font-weight="400" fill="#526581">Validate blocking actions, supported applications, TLS visibility and threat logs.</text>
<text x="931" y="1568" font-size="18" font-weight="400" fill="#526581">Document any accepted feature gap before cutting consumers over.</text>
<text x="931" y="1590" font-size="18" font-weight="400" fill="#526581">Keep the current RP publication available until end-to-end tests pass.</text>
<text x="44" y="1836" font-size="17" font-weight="400" fill="#526581">GCP third-party ingress | Reverse proxy removal | Architecture options | 2026-10-12</text>
<text x="44" y="64" font-size="34" font-weight="700" fill="#172b4d">C / Workload-side PSC with Cloud NGFW Enterprise</text>
<text x="44" y="104" font-size="21" font-weight="400" fill="#526581">Publish inside the workload VPC and inspect at the protected interface. No central PA transit on this path.</text>
<rect x="44" y="126" width="390.953125" height="30" rx="6" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="57" y="147" font-size="17" font-weight="700" fill="#172b4d">CANDIDATE / DIFFERENT SECURITY MODEL</text>
<text x="116" y="187" font-size="18" font-weight="400" fill="#526581">Application traffic</text>
<text x="512" y="187" font-size="18" font-weight="400" fill="#526581">Return traffic</text>
<text x="902" y="187" font-size="18" font-weight="400" fill="#526581">Native health checks</text>
<text x="1312" y="187" font-size="18" font-weight="400" fill="#526581">Resource / policy reference</text>
<rect x="1428" y="498" width="263.171875" height="27" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1436" y="515" font-size="17" font-weight="400" fill="#7454b1">Only permitted traffic is delivered</text>
<rect x="1428" y="914" width="263.171875" height="27" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1436" y="931" font-size="17" font-weight="400" fill="#7454b1">Only permitted traffic is delivered</text>
<rect x="492" y="923" width="353.234375" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="500" y="941" font-size="18" font-weight="400" fill="#7454b1">No static route to a Cloud NGFW endpoint</text>
<rect x="492" y="960" width="462.359375" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="500" y="978" font-size="18" font-weight="400" fill="#b23b39">No existing Palo appliance traversal on this service path</text>
<rect x="419" y="1095" width="686.53125" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="427" y="1113" font-size="18" font-weight="400" fill="#07816e">Response uses the published PSC service path; no new route to the consumer VPC</text>
</g>
