<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1870" viewBox="0 0 1800 1870" role="img" aria-labelledby="title desc">
<title id="title">C / Workload-side PSC with Cloud NGFW Enterprise</title>
<desc id="desc">Publish inside the workload VPC and inspect at the protected interface. No central PA transit on this path.. Blue lines show application traffic; green dashed lines show return traffic; amber dotted lines show native health checks; gray dotted lines show resource or policy references. Purple lines show policy-directed inspection. Red lines show rejected or bypass paths. See adjacent ADR option for requirements.</desc>
