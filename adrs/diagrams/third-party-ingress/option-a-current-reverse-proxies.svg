<text x="1476" y="732" font-size="18" font-weight="400" fill="#526581">listener</text>
<rect x="44" y="972" width="540" height="215" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="68" y="1002" font-size="20" font-weight="700" fill="#172b4d">Why the RPs are here</text>
<text x="68" y="1030" font-size="18" font-weight="400" fill="#526581">The passthrough NLB cannot attach native backends from</text>
<text x="68" y="1052" font-size="18" font-weight="400" fill="#526581">the intranet VPC.</text>
<text x="68" y="1074" font-size="18" font-weight="400" fill="#526581">RPs provide an allowed local backend and initiate the</text>
<text x="68" y="1096" font-size="18" font-weight="400" fill="#526581">cross-VPC connection.</text>
<rect x="612" y="972" width="564" height="215" rx="12" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="636" y="1002" font-size="20" font-weight="700" fill="#172b4d">What the RPs preserve</text>
<text x="636" y="1030" font-size="18" font-weight="400" fill="#526581">A VM source that can use tagged routes.</text>
<text x="636" y="1052" font-size="18" font-weight="400" fill="#526581">Current regional PA selection and configured return routing.</text>
<text x="636" y="1074" font-size="18" font-weight="400" fill="#526581">Any RP DNS, TLS and application behavior still needs an</text>
<text x="636" y="1096" font-size="18" font-weight="400" fill="#526581">inventory.</text>
<rect x="1204" y="972" width="552" height="215" rx="12" fill="#fff7e8" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1228" y="1002" font-size="20" font-weight="700" fill="#172b4d">Health checks are not full-path proof</text>
<text x="1228" y="1030" font-size="18" font-weight="400" fill="#526581">Native NLB probes reach RP backends.</text>
<text x="1228" y="1052" font-size="18" font-weight="400" fill="#526581">They do not prove RP-to-PA-to-database reachability.</text>
<text x="1228" y="1074" font-size="18" font-weight="400" fill="#526581">Use a consumer-side application transaction.</text>
<rect x="44" y="1220" width="835" height="211" rx="12" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="68" y="1250" font-size="20" font-weight="700" fill="#172b4d">Traffic and encryption boundaries</text>
<text x="68" y="1278" font-size="18" font-weight="400" fill="#526581">PSC performs producer-side NAT. The RP starts a separate backend connection.</text>
<text x="68" y="1300" font-size="18" font-weight="400" fill="#526581">Do not assume the original client packet source reaches the database.</text>
<text x="68" y="1322" font-size="18" font-weight="400" fill="#526581">Actual RP TLS termination and PA decryption depend on the existing configuration.</text>
<rect x="907" y="1220" width="849" height="211" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="931" y="1250" font-size="20" font-weight="700" fill="#172b4d">Operational result</text>
<text x="931" y="1278" font-size="18" font-weight="400" fill="#526581">No routing redesign and no RP removal. This remains the rollback path.</text>
<text x="931" y="1300" font-size="18" font-weight="400" fill="#526581">RP patching, capacity, availability and configuration ownership remain.</text>
<text x="931" y="1322" font-size="18" font-weight="400" fill="#526581">Database health and writer selection must be tested above simple TCP reachability.</text>
<text x="44" y="1476" font-size="17" font-weight="400" fill="#526581">GCP third-party ingress | Reverse proxy removal | Architecture options | 2026-10-12</text>
<text x="44" y="64" font-size="34" font-weight="700" fill="#172b4d">A / Keep the current reverse proxies</text>
<text x="44" y="104" font-size="21" font-weight="400" fill="#526581">Existing architecture: passthrough frontends, VM-based regional steering, Palo inspection.</text>
