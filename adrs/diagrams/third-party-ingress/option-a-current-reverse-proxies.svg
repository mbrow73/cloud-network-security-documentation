<title id="title">A / Keep the current reverse proxies</title>
<desc id="desc">Existing architecture: passthrough frontends, VM-based regional steering, Palo inspection.. Blue lines show application traffic; green dashed lines show return traffic; amber dotted lines show native health checks; gray dotted lines show resource or policy references. Purple lines show policy-directed inspection. Red lines show rejected or bypass paths. See adjacent ADR option for requirements.</desc>
