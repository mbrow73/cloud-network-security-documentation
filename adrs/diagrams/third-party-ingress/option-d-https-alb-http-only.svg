<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1950" viewBox="0 0 1800 1950" role="img" aria-labelledby="title desc">
<title id="title">D / Internal HTTPS Application Load Balancer</title>
<desc id="desc">Regional internal Envoy ALB, not global/classic external GFE. No native MariaDB support.. Blue lines show application traffic; green dashed lines show return traffic; amber dotted lines show native health checks; gray dotted lines show resource or policy references. Purple lines show policy-directed inspection. Red lines show rejected or bypass paths. See adjacent ADR option for requirements.</desc>
<defs><marker id="ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#172b4d"/></marker><marker id="ink-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#172b4d"/></marker><marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#526581"/></marker><marker id="muted-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#526581"/></marker><marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#1769aa"/></marker><marker id="data-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#1769aa"/></marker><marker id="return" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#07816e"/></marker><marker id="return-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#07816e"/></marker><marker id="health" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#a86b08"/></marker><marker id="health-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#a86b08"/></marker><marker id="inspect" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#7454b1"/></marker><marker id="inspect-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#7454b1"/></marker><marker id="risk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#b23b39"/></marker><marker id="risk-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#b23b39"/></marker><marker id="control" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#738197"/></marker><marker id="control-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 9,0 L 0,4.5 L 9,9 Z" fill="#738197"/></marker></defs>
