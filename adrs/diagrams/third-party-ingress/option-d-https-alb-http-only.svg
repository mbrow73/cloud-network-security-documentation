<text x="68" y="242" font-size="24" font-weight="700" fill="#172b4d">1. Native MariaDB traffic: incompatible protocol</text>
<text x="68" y="274" font-size="19" font-weight="400" fill="#526581">TLS on a MariaDB connection does not turn the database protocol into HTTPS.</text>
<rect x="68" y="308" width="337" height="160" rx="12" fill="#eef4fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="92" y="338" font-size="20" font-weight="700" fill="#172b4d">MariaDB client</text>
<text x="92" y="366" font-size="18" font-weight="400" fill="#526581">Native database wire protocol</text>
<text x="92" y="388" font-size="18" font-weight="400" fill="#526581">TCP, optionally database TLS</text>
<rect x="682" y="308" width="389" height="160" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="706" y="338" font-size="20" font-weight="700" fill="#172b4d">HTTPS ALB</text>
<text x="706" y="366" font-size="18" font-weight="400" fill="#526581">HTTP(S) frontend and HTTP-family</text>
<text x="706" y="388" font-size="18" font-weight="400" fill="#526581">backends</text>
<text x="706" y="410" font-size="18" font-weight="400" fill="#526581">Not an arbitrary TCP relay</text>
<rect x="1397" y="308" width="331" height="160" rx="12" fill="#eef8f5" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1421" y="338" font-size="20" font-weight="700" fill="#172b4d">MariaDB listener</text>
<text x="1421" y="366" font-size="18" font-weight="400" fill="#526581">Database protocol, not HTTP</text>
<text x="1421" y="388" font-size="18" font-weight="400" fill="#526581">Port 3306 does not change that</text>
<text x="68" y="603" font-size="24" font-weight="700" fill="#172b4d">2. Separate HTTP(S) service: conditional backend inspection</text>
<text x="68" y="635" font-size="19" font-weight="400" fill="#526581">Palo appears only if the effective backend route actually sends traffic through it.</text>
<text x="82" y="692" font-size="21" font-weight="700" fill="#172b4d">Consumer VPC</text>
<text x="370" y="692" font-size="21" font-weight="700" fill="#172b4d">Shared ingress VPC</text>
<text x="370" y="719" font-size="18" font-weight="400" fill="#526581">Managed Envoy: VM-tagged regional routes do not apply</text>
<text x="1006" y="692" font-size="21" font-weight="700" fill="#172b4d">Conditional PA path</text>
<text x="1334" y="692" font-size="21" font-weight="700" fill="#172b4d">HTTP workload VPC</text>
<rect x="80" y="768" width="230" height="167" rx="12" fill="#eef4fc" stroke="#cad4e1" stroke-width="1.5"/>
<text x="104" y="798" font-size="20" font-weight="700" fill="#172b4d">HTTPS client</text>
<text x="104" y="826" font-size="18" font-weight="400" fill="#526581">PSC consumer</text>
<text x="104" y="848" font-size="18" font-weight="400" fill="#526581">endpoint</text>
<text x="104" y="870" font-size="18" font-weight="400" fill="#526581">Client TLS connection</text>
<rect x="368" y="768" width="252" height="167" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="392" y="798" font-size="20" font-weight="700" fill="#172b4d">PSC attachment</text>
<text x="392" y="826" font-size="18" font-weight="400" fill="#526581">Publishes regional ALB</text>
<text x="392" y="848" font-size="18" font-weight="400" fill="#526581">Producer connection</text>
<rect x="644" y="768" width="298" height="167" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="668" y="798" font-size="20" font-weight="700" fill="#172b4d">HTTPS ALB + Envoy</text>
<text x="668" y="826" font-size="18" font-weight="400" fill="#526581">Client TLS ends here.</text>
<text x="668" y="848" font-size="18" font-weight="400" fill="#526581">New backend connection</text>
<text x="668" y="870" font-size="18" font-weight="400" fill="#526581">Source: proxy-only subnet</text>
<rect x="1004" y="768" width="268" height="167" rx="12" fill="#fff7e8" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1028" y="798" font-size="20" font-weight="700" fill="#172b4d">Palo, if routed inline</text>
<text x="1028" y="826" font-size="18" font-weight="400" fill="#526581">Same routing issue as B</text>
<text x="1028" y="848" font-size="18" font-weight="400" fill="#526581">No automatic insertion</text>
<rect x="1332" y="768" width="388" height="167" rx="12" fill="#eef8f5" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1356" y="798" font-size="20" font-weight="700" fill="#172b4d">HTTP(S) application</text>
<text x="1356" y="826" font-size="18" font-weight="400" fill="#526581">Direct supported HTTP backend</text>
<text x="1356" y="848" font-size="18" font-weight="400" fill="#526581">Not the MariaDB listener</text>
<rect x="44" y="1174" width="545" height="359" rx="12" fill="#fff7e8" stroke="#cad4e1" stroke-width="1.5"/>
<text x="68" y="1204" font-size="20" font-weight="700" fill="#172b4d">Backend leg: HTTP</text>
<text x="68" y="1232" font-size="18" font-weight="400" fill="#526581">Plaintext between Envoy and the HTTP workload.</text>
<text x="68" y="1254" font-size="18" font-weight="400" fill="#526581">PA sees plaintext only when it is actually inline.</text>
<text x="68" y="1276" font-size="18" font-weight="400" fill="#526581">Changing to plaintext requires a deliberate application /</text>
<text x="68" y="1298" font-size="18" font-weight="400" fill="#526581">security decision.</text>
<text x="68" y="1320" font-size="18" font-weight="400" fill="#526581">Certificate and client-authentication ownership move to the</text>
<text x="68" y="1342" font-size="18" font-weight="400" fill="#526581">ALB.</text>
<rect x="617" y="1174" width="545" height="359" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="641" y="1204" font-size="20" font-weight="700" fill="#172b4d">Backend leg: HTTPS</text>
<text x="641" y="1232" font-size="18" font-weight="400" fill="#526581">A new encrypted TLS session starts at Envoy.</text>
<text x="641" y="1254" font-size="18" font-weight="400" fill="#526581">PA does not inherit the ALB&#x27;s decrypted client payload.</text>
<text x="641" y="1276" font-size="18" font-weight="400" fill="#526581">Deep inspection needs separate supported decryption on the</text>
<text x="641" y="1298" font-size="18" font-weight="400" fill="#526581">backend leg.</text>
<text x="641" y="1320" font-size="18" font-weight="400" fill="#526581">Native health checks do not prove this inspection path.</text>
<rect x="1190" y="1174" width="566" height="359" rx="12" fill="#fff1ef" stroke="#cad4e1" stroke-width="1.5"/>
<text x="1214" y="1204" font-size="20" font-weight="700" fill="#172b4d">Routing and scope</text>
<text x="1214" y="1232" font-size="18" font-weight="400" fill="#526581">For the existing shared VPC, regional PA overrides based on VM</text>
<text x="1214" y="1254" font-size="18" font-weight="400" fill="#526581">tags are unavailable.</text>
<text x="1214" y="1276" font-size="18" font-weight="400" fill="#526581">Central PA transit or regional topology redesign still requires</text>
<text x="1214" y="1298" font-size="18" font-weight="400" fill="#526581">validation.</text>
<text x="1214" y="1320" font-size="18" font-weight="400" fill="#526581">Workload-side Cloud NGFW is a different control model, not PA</text>
<text x="1214" y="1342" font-size="18" font-weight="400" fill="#526581">traversal.</text>
<text x="1214" y="1364" font-size="18" font-weight="400" fill="#526581">An HTTP API over MariaDB would be a new service contract.</text>
<text x="68" y="1603" font-size="24" font-weight="700" fill="#172b4d">3. Two different ALB backend paths</text>
<text x="68" y="1635" font-size="19" font-weight="400" fill="#526581">Google backbone transport does not mean both products use the same source addresses or route selection.</text>
<rect x="68" y="1659" width="812" height="165" rx="12" fill="#f0f5ff" stroke="#cad4e1" stroke-width="1.5"/>
<text x="92" y="1689" font-size="20" font-weight="700" fill="#172b4d">Regional internal ALB: Envoy</text>
<text x="92" y="1717" font-size="18" font-weight="400" fill="#526581">Backend source: proxy-only subnet IP in the VPC.</text>
<text x="92" y="1739" font-size="18" font-weight="400" fill="#526581">Untagged static routes apply; VM-tagged routes do not.</text>
<text x="92" y="1761" font-size="18" font-weight="400" fill="#526581">An applicable forward route can use the inline PA hop.</text>
<rect x="914" y="1659" width="818" height="165" rx="12" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="938" y="1689" font-size="20" font-weight="700" fill="#172b4d">Global / classic external ALB: GFE</text>
<text x="938" y="1717" font-size="18" font-weight="400" fill="#526581">Native backend sources: 35.191.0.0/16 and 130.211.0.0/22.</text>
<text x="938" y="1739" font-size="18" font-weight="400" fill="#526581">Google special routing delivers GFE traffic to the backend VPC.</text>
<text x="938" y="1761" font-size="18" font-weight="400" fill="#526581">Do not use this GFE model to describe Option D.</text>
<text x="44" y="1916" font-size="17" font-weight="400" fill="#526581">GCP third-party ingress | Reverse proxy removal | Architecture options | 2026-10-12</text>
<text x="44" y="64" font-size="34" font-weight="700" fill="#172b4d">D / Internal HTTPS Application Load Balancer</text>
<text x="44" y="104" font-size="21" font-weight="400" fill="#526581">Regional internal Envoy ALB, not global/classic external GFE. No native MariaDB support.</text>
<rect x="44" y="126" width="310.96875" height="30" rx="6" fill="#f4f6f9" stroke="#cad4e1" stroke-width="1.5"/>
<text x="57" y="147" font-size="17" font-weight="700" fill="#172b4d">EXCLUDED FOR NATIVE MARIADB</text>
<text x="116" y="187" font-size="18" font-weight="400" fill="#526581">Application traffic</text>
<text x="512" y="187" font-size="18" font-weight="400" fill="#526581">Return traffic</text>
<text x="902" y="187" font-size="18" font-weight="400" fill="#526581">Native health checks</text>
<text x="1312" y="187" font-size="18" font-weight="400" fill="#526581">Resource / policy reference</text>
<path d="M 554,375 L 578,399 M 554,399 L 578,375" fill="none" stroke="#b23b39" stroke-width="5"/>
<path d="M 1208,375 L 1232,399 M 1208,399 L 1232,375" fill="none" stroke="#b23b39" stroke-width="5"/>
<rect x="460" y="476" width="537.421875" height="30" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="468" y="496" font-size="20" font-weight="400" fill="#b23b39">No direct MariaDB session can be carried through this ALB</text>
<rect x="525" y="968" width="455.421875" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="533" y="986" font-size="18" font-weight="400" fill="#07816e">Separate backend connection; return routing confirmed</text>
</g>
</svg>
