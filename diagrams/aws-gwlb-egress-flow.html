<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AWS GWLB Egress Core Flow</title>
<style>
  body { margin: 0; background: #f6f8fb; font-family: Arial, Helvetica, sans-serif; color: #172033; }
  .wrap { padding: 24px; }
  .card { background: #fff; border: 1px solid #d8dee9; border-radius: 16px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); overflow: hidden; }
  .title { padding: 18px 24px 10px; border-bottom: 1px solid #e5e9f0; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0; color: #526072; font-size: 14px; }
  svg { width: 100%; height: auto; display: block; }
  .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
  .egress-lane { fill: #fbfdff; stroke: #94a3b8; stroke-width: 2; }
  .lane-title { font-size: 15px; font-weight: 700; fill: #334155; }
  .box { stroke-width: 1.8; rx: 12; ry: 12; }
  .workload { fill: #e0f2fe; stroke: #0284c7; }
  .proxy { fill: #ecfdf5; stroke: #059669; }
  .route { fill: #fef9c3; stroke: #ca8a04; }
  .inspect { fill: #fee2e2; stroke: #dc2626; }
  .external { fill: #f1f5f9; stroke: #64748b; }
  .policy { fill: #ede9fe; stroke: #7c3aed; }
  .private { fill: #f0f9ff; stroke: #2563eb; }
  .natpriv { fill: #fff7ed; stroke: #ea580c; }
  .label { font-size: 15px; font-weight: 700; fill: #0f172a; }
  .sub { font-size: 12px; fill: #475569; }
  .small { font-size: 11px; fill: #475569; }
  .arrow { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
  .public { stroke: #0f172a; stroke-width: 3.2; fill: none; marker-end: url(#arrow); }
  .return { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
  .private-line { stroke: #2563eb; stroke-width: 2.2; fill: none; stroke-dasharray: 8 5; marker-end: url(#arrow-blue); }
  .nat-line { stroke: #ea580c; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-orange); }
  .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; rx: 10; ry: 10; }
  .legend-text { font-size: 12px; fill: #334155; }
  .tag { font-size: 11px; font-weight: 700; fill: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="title">
      <h1>AWS GWLB Egress Core - EWP URL Filtering Flow</h1>
      <p>Public internet egress is emphasized. Private on-prem routes inside the egress VPC are shown as secondary dashed paths.</p>
    </div>
    <svg viewBox="0 0 1600 1040" role="img" aria-label="AWS GWLB egress flow diagram">
      <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#334155" /></marker>
        <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#dc2626" /></marker>
        <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb" /></marker>
        <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#ea580c" /></marker>
      </defs>

      <!-- Lanes -->
      <rect class="lane" x="40" y="70" width="285" height="480" />
      <text class="lane-title" x="60" y="100">Workload VPCs</text>

      <rect class="lane" x="360" y="70" width="220" height="480" />
      <text class="lane-title" x="380" y="100">Transit</text>

      <rect class="egress-lane" x="620" y="70" width="690" height="700" />
      <text class="lane-title" x="640" y="100">Egress VPC / EGRESS Zone</text>

      <rect class="lane" x="1345" y="70" width="215" height="480" />
      <text class="lane-title" x="1365" y="100">Public Internet</text>

      <!-- Main public flow -->
      <rect class="box workload" x="80" y="170" width="205" height="95" />
      <text class="label" x="182" y="207" text-anchor="middle">AWS Workload</text>
      <text class="sub" x="182" y="231" text-anchor="middle">explicit EWP target</text>

      <rect class="box route" x="390" y="170" width="160" height="95" />
      <text class="label" x="470" y="207" text-anchor="middle">TGW</text>
      <text class="sub" x="470" y="231" text-anchor="middle">routing hub</text>

      <rect class="box proxy" x="665" y="160" width="200" height="105" />
      <text class="label" x="765" y="198" text-anchor="middle">EWP</text>
      <text class="sub" x="765" y="222" text-anchor="middle">explicit proxy</text>
      <text class="sub" x="765" y="243" text-anchor="middle">policy source object</text>

      <rect class="box route" x="920" y="160" width="155" height="105" />
      <text class="label" x="998" y="198" text-anchor="middle">GWLBe</text>
      <text class="sub" x="998" y="222" text-anchor="middle">egress endpoint</text>
      <text class="sub" x="998" y="243" text-anchor="middle">service insertion</text>

      <rect class="box inspect" x="760" y="365" width="225" height="110" />
      <text class="label" x="872" y="402" text-anchor="middle">Inspection</text>
      <text class="sub" x="872" y="426" text-anchor="middle">Palo Alto via GWLB</text>
      <text class="sub" x="872" y="447" text-anchor="middle">URL Filtering + Threat</text>

      <rect class="box route" x="1110" y="160" width="150" height="105" />
      <text class="label" x="1185" y="194" text-anchor="middle">NAT Gateway</text>
      <text class="sub" x="1185" y="218" text-anchor="middle">public + private NAT</text>
      <text class="sub" x="1185" y="239" text-anchor="middle">post-inspection / nonroutable</text>

      <rect class="box route" x="1380" y="160" width="135" height="85" />
      <text class="label" x="1448" y="196" text-anchor="middle">IGW</text>
      <text class="sub" x="1448" y="220" text-anchor="middle">internet edge</text>

      <rect class="box external" x="1380" y="360" width="135" height="90" />
      <text class="label" x="1448" y="396" text-anchor="middle">Internet</text>
      <text class="sub" x="1448" y="420" text-anchor="middle">SaaS / APIs</text>

      <!-- Private subnet secondary flows inside egress VPC -->
      <rect class="box private" x="665" y="575" width="240" height="105" />
      <text class="label" x="785" y="612" text-anchor="middle">Routable Private Subnets</text>
      <text class="sub" x="785" y="636" text-anchor="middle">on-prem prefix list</text>
      <text class="sub" x="785" y="657" text-anchor="middle">routes directly to TGW</text>

      <rect class="box private" x="955" y="575" width="245" height="105" />
      <text class="label" x="1078" y="612" text-anchor="middle">Nonroutable Private Subnets</text>
      <text class="sub" x="1078" y="636" text-anchor="middle">on-prem prefix list only</text>
      <text class="sub" x="1078" y="657" text-anchor="middle">no 0/0 bypass route</text>

      <rect class="box external" x="390" y="390" width="160" height="90" />
      <text class="label" x="470" y="426" text-anchor="middle">On-Prem</text>
      <text class="sub" x="470" y="450" text-anchor="middle">private prefixes</text>

      <!-- Policy area below lanes, no overlap -->
      <rect class="box policy" x="80" y="835" width="330" height="115" />
      <text class="label" x="245" y="872" text-anchor="middle">Security Rule</text>
      <text class="sub" x="245" y="896" text-anchor="middle">EGRESS-EWP-URL-GUARDRAILS</text>
      <text class="sub" x="245" y="917" text-anchor="middle">from EGRESS to EGRESS | source EWP</text>

      <rect class="box policy" x="455" y="835" width="350" height="115" />
      <text class="label" x="630" y="872" text-anchor="middle">URL Filtering Profile</text>
      <text class="sub" x="630" y="896" text-anchor="middle">URLF-EGRESS-PROXY-GUARDRAILS</text>
      <text class="sub" x="630" y="917" text-anchor="middle">alert approved categories, block risky categories</text>

      <rect class="box policy" x="850" y="835" width="330" height="115" />
      <text class="label" x="1015" y="872" text-anchor="middle">Future Exceptions</text>
      <text class="sub" x="1015" y="896" text-anchor="middle">approved blocked URLs only</text>
      <text class="sub" x="1015" y="917" text-anchor="middle">custom URL category + rule when required</text>

      <rect class="note" x="1225" y="835" width="310" height="115" />
      <text class="label" x="1380" y="872" text-anchor="middle">Logging</text>
      <text class="sub" x="1380" y="896" text-anchor="middle">URL: Monitor &gt; Logs &gt; URL Filtering</text>
      <text class="sub" x="1380" y="917" text-anchor="middle">Traffic: Monitor &gt; Logs &gt; Traffic</text>

      <!-- Public route connectors emphasized -->
      <path class="public" d="M285 218 C325 218, 355 218, 390 218" />
      <path class="public" d="M550 218 C595 218, 625 213, 665 213" />
      <path class="public" d="M865 213 C885 213, 900 213, 920 213" />
      <path class="public" d="M998 265 C998 315, 952 345, 930 365" />
      <path class="return" d="M985 420 C1060 400, 1108 318, 1075 238" />
      <path class="public" d="M1075 213 C1090 213, 1098 213, 1110 213" />
      <path class="public" d="M1260 203 C1305 203, 1340 203, 1380 203" />
      <path class="public" d="M1448 245 C1448 285, 1448 325, 1448 360" />

      <!-- Private route connectors secondary -->
      <path class="private-line" d="M665 628 C590 610, 505 520, 470 265" />
      <path class="private-line" d="M470 390 C470 345, 470 305, 470 265" />
      <path class="nat-line" d="M1115 575 C1195 500, 1230 360, 1225 265" />
      <path class="nat-line" d="M1110 213 C900 95, 585 105, 510 170" />
      <path class="nat-line" d="M470 265 C470 310, 470 350, 470 390" />

      <!-- Flow labels -->
      <text class="small" x="337" y="203" text-anchor="middle">proxy request</text>
      <text class="small" x="610" y="202" text-anchor="middle">TGW route</text>
      <text class="small" x="892" y="196" text-anchor="middle">to GWLBe</text>
      <text class="small" x="1015" y="325" text-anchor="middle">service chain</text>
      <text class="small" x="1090" y="350" text-anchor="middle">u-turn return to GWLBe</text>
      <text class="small" x="1308" y="187" text-anchor="middle">NAT to IGW</text>
      <text class="small" x="1462" y="310" text-anchor="middle">IGW to internet</text>
      <text class="small" x="590" y="575" text-anchor="middle">routable private to TGW</text>
      <text class="small" x="1240" y="470" text-anchor="middle">nonroutable to NAT GW</text>
      <text class="small" x="820" y="115" text-anchor="middle">private NAT returns to TGW</text>
      <text class="small" x="506" y="348" text-anchor="middle">TGW to on-prem</text>

      <!-- Legend, outside Egress VPC box -->
      <rect class="workload" x="1225" y="790" width="18" height="18" rx="4" />
      <text class="legend-text" x="1250" y="804">Workload</text>
      <rect class="proxy" x="1320" y="790" width="18" height="18" rx="4" />
      <text class="legend-text" x="1345" y="804">EWP</text>
      <rect class="inspect" x="1390" y="790" width="18" height="18" rx="4" />
      <text class="legend-text" x="1415" y="804">Inspection</text>
      <rect class="private" x="1490" y="790" width="18" height="18" rx="4" />
      <text class="legend-text" x="1515" y="804">Private routes</text>
    </svg>
  </div>
</div>
</body>
</html>
