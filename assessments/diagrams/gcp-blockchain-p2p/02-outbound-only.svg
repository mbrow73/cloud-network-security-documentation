<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1600" viewBox="0 0 2160 1600" role="img" aria-labelledby="title desc"><title id="title">Outbound-only peering</title><desc id="desc">Proposed GCP blockchain DMZ architecture for a PCI-constrained environment. Public native P2P is separated from application-initiated private RPC over two authenticated TLS legs with inspection. No public listener; only node-initiated P2P sessions and stateful replies. Base outbound-only compatibility requires verification.</desc><defs><marker id="2863c7" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2863c7"/></marker><marker id="087f78" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#087f78"/></marker><marker id="53667d" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#53667d"/></marker><marker id="b83e4d" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b83e4d"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="2160" height="1600" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><rect x="64" y="360" width="260" height="800" rx="22" fill="#f0f3f7" stroke="#dae2eb" stroke-width="1.5"/><rect x="356" y="360" width="380" height="800" rx="22" fill="#eef3fc" stroke="#dae2eb" stroke-width="1.5"/><rect x="768" y="360" width="468" height="800" rx="22" fill="#edf7f5" stroke="#dae2eb" stroke-width="1.5"/><rect x="1268" y="360" width="412" height="800" rx="22" fill="#eef3fc" stroke="#dae2eb" stroke-width="1.5"/><rect x="1712" y="360" width="384" height="800" rx="22" fill="#f0f2f8" stroke="#dae2eb" stroke-width="1.5"/><path d="M 380 666 L 300 666" fill="none" stroke="#2863c7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2863c7)"/><path d="M 792 666 L 712 666" fill="none" stroke="#2863c7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2863c7)"/><path d="M 300 746 L 380 746" fill="none" stroke="#53667d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#53667d)"/><path d="M 712 746 L 792 746" fill="none" stroke="#53667d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#53667d)"/><path d="M 1736 981 L 1656 981" fill="none" stroke="#2863c7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2863c7)"/><path d="M 1292 981 L 1212 981" fill="none" stroke="#2863c7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#2863c7)"/><path d="M 1002 900 L 1002 800" fill="none" stroke="#087f78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#087f78)"/><rect x="64" y="57" width="6" height="118" rx="3" fill="#087f78" stroke="none" stroke-width="1.5"/><text x="90" y="77" font-size="16" font-weight="700" fill="#53667d">NETWORK SECURITY / GCP / PCI-INFORMED REFERENCE DESIGN</text><text x="88" y="133" font-size="48" font-weight="700" fill="#15263f">Outbound-only peering</text><text x="90" y="170" font-size="21" font-weight="400" fill="#53667d">An isolated blockchain DMZ. One private, inspected application boundary. No direct internet-to-CDE path.</text><rect x="1840" y="60" width="265.984375" height="30" rx="15" fill="#e7edf8" stroke="#e7edf8" stroke-width="1.5"/><text x="1854" y="80" font-size="14" font-weight="700" fill="#2863c7">OPTION B / REV 2 / PROPOSED</text><text x="1892" y="124" font-size="17" font-weight="700" fill="#53667d">28 OCT 2026</text><rect x="64" y="208" width="2032" height="100" rx="18" fill="#15263f" stroke="#15263f" stroke-width="1.5"/><text x="90" y="240" font-size="13" font-weight="700" fill="#9eb6d4">PUBLIC P2P POLICY</text><text x="90" y="277" font-size="23" font-weight="700" fill="#ffffff">Node initiates only; replies allowed</text><text x="832" y="240" font-size="13" font-weight="700" fill="#9eb6d4">INSPECTABLE TLS</text><text x="832" y="277" font-size="23" font-weight="700" fill="#ffffff">Private RPC only — two TLS legs</text><text x="1526" y="240" font-size="13" font-weight="700" fill="#9eb6d4">DATA BOUNDARY</text><text x="1526" y="277" font-size="23" font-weight="700" fill="#ffffff">No PAN / SAD in blockchain flows</text><rect x="88" y="382" width="47.46875" height="30" rx="15" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="102" y="402" font-size="14" font-weight="700" fill="#53667d">01</text><text x="88" y="448" font-size="23" font-weight="700" fill="#15263f">Public internet</text><text x="88" y="476" font-size="16" font-weight="400" fill="#53667d">Untrusted peers</text><rect x="380" y="382" width="47.46875" height="30" rx="15" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="394" y="402" font-size="14" font-weight="700" fill="#53667d">02</text><text x="380" y="448" font-size="23" font-weight="700" fill="#15263f">Security edge</text><text x="380" y="476" font-size="16" font-weight="400" fill="#53667d">Dedicated perimeter controls</text><rect x="792" y="382" width="47.46875" height="30" rx="15" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="806" y="402" font-size="14" font-weight="700" fill="#53667d">03</text><text x="792" y="448" font-size="23" font-weight="700" fill="#15263f">Blockchain DMZ</text><text x="792" y="476" font-size="16" font-weight="400" fill="#53667d">Separate VPC / isolated node tier</text><rect x="1292" y="382" width="47.46875" height="30" rx="15" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="1306" y="402" font-size="14" font-weight="700" fill="#53667d">04</text><text x="1292" y="448" font-size="23" font-weight="700" fill="#15263f">Private boundary</text><text x="1292" y="476" font-size="16" font-weight="400" fill="#53667d">Palo TLS + RPC policy controls</text><rect x="1736" y="382" width="47.46875" height="30" rx="15" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="1750" y="402" font-size="14" font-weight="700" fill="#53667d">05</text><text x="1736" y="448" font-size="23" font-weight="700" fill="#15263f">Trusted workload</text><text x="1736" y="476" font-size="16" font-weight="400" fill="#53667d">CDE or connected / in-scope tier</text><rect x="88" y="620" width="212" height="180" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="89" y="642" width="4" height="136" rx="2" fill="#53667d" stroke="#53667d" stroke-width="1.5"/><text x="112" y="661" font-size="23" font-weight="700" fill="#15263f">Public peers</text><text x="112" y="688" font-size="18" font-weight="400" fill="#15263f">Ethereum + Base</text><text x="112" y="714" font-size="18" font-weight="400" fill="#15263f">public test</text><text x="112" y="740" font-size="18" font-weight="400" fill="#15263f">networks</text><text x="112" y="778" font-size="16" font-weight="400" fill="#53667d">Dynamic peer IPs</text><rect x="380" y="502" width="332" height="89" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="381" y="524" width="4" height="45" rx="2" fill="#087f78" stroke="#087f78" stroke-width="1.5"/><text x="404" y="543" font-size="23" font-weight="700" fill="#15263f">No public node VIP</text><text x="404" y="569" font-size="17" font-weight="400" fill="#53667d">No inbound P2P publication</text><rect x="380" y="620" width="332" height="180" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="381" y="642" width="4" height="136" rx="2" fill="#2863c7" stroke="#2863c7" stroke-width="1.5"/><text x="404" y="650" font-size="13" font-weight="700" fill="#2863c7">C1 / PALO ALTO / STATEFUL L4</text><text x="404" y="682" font-size="23" font-weight="700" fill="#15263f">Perimeter NGFW</text><text x="404" y="711" font-size="18" font-weight="400" fill="#15263f">Egress SNAT + peer policy</text><text x="404" y="740" font-size="18" font-weight="700" fill="#b83e4d">Deny new inbound sessions</text><text x="404" y="774" font-size="16" font-weight="400" fill="#53667d">Stateful TCP / UDP replies only</text><rect x="792" y="502" width="420" height="298" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="793" y="524" width="4" height="254" rx="2" fill="#087f78" stroke="#087f78" stroke-width="1.5"/><text x="816" y="532" font-size="13" font-weight="700" fill="#087f78">C4 / ISOLATED HOSTS / NO PUBLIC VM IPs</text><text x="816" y="564" font-size="23" font-weight="700" fill="#15263f">Self-hosted nodes</text><rect x="816" y="586" width="372" height="66" rx="12" fill="#eff7f5" stroke="#d3e7e3" stroke-width="1.5"/><text x="834" y="612" font-size="19" font-weight="700" fill="#15263f">Ethereum Sepolia</text><text x="834" y="636" font-size="16" font-weight="400" fill="#53667d">Geth + Lighthouse</text><rect x="816" y="666" width="372" height="66" rx="12" fill="#eff7f5" stroke="#d3e7e3" stroke-width="1.5"/><text x="834" y="692" font-size="19" font-weight="700" fill="#15263f">Base Sepolia</text><text x="834" y="716" font-size="16" font-weight="400" fill="#53667d">Reth + rollup node</text><text x="816" y="771" font-size="17" font-weight="400" fill="#53667d">Private Base → Ethereum APIs [3]</text><rect x="1292" y="502" width="364" height="298" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="1293" y="524" width="4" height="254" rx="2" fill="#2863c7" stroke="#2863c7" stroke-width="1.5"/><text x="1316" y="532" font-size="13" font-weight="700" fill="#2863c7">C1 / SEGMENTATION / DEFAULT DENY</text><text x="1316" y="564" font-size="23" font-weight="700" fill="#15263f">Boundary policy</text><text x="1316" y="600" font-size="18" font-weight="400" fill="#15263f">Only named RPC callers.</text><text x="1316" y="634" font-size="18" font-weight="400" fill="#15263f">No public reachability to CDE.</text><text x="1316" y="668" font-size="18" font-weight="400" fill="#15263f">No new node → CDE sessions.</text><text x="1316" y="702" font-size="18" font-weight="400" fill="#15263f">No direct RPC bypass route.</text><text x="1316" y="753" font-size="16" font-weight="400" fill="#53667d">Exact node dependencies are</text><text x="1316" y="776" font-size="16" font-weight="400" fill="#53667d">separately allowlisted.</text><rect x="1736" y="502" width="336" height="298" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="1737" y="524" width="4" height="254" rx="2" fill="#2863c7" stroke="#2863c7" stroke-width="1.5"/><text x="1760" y="532" font-size="13" font-weight="700" fill="#2863c7">C5 / DATA + INTEGRITY BOUNDARY</text><text x="1760" y="564" font-size="23" font-weight="700" fill="#15263f">Application isolation</text><text x="1760" y="600" font-size="17" font-weight="400" fill="#15263f">No internet-facing node here.</text><text x="1760" y="632" font-size="17" font-weight="400" fill="#15263f">No node-held payment keys.</text><text x="1760" y="664" font-size="17" font-weight="400" fill="#15263f">No raw PAN / SAD in RPC,</text><text x="1760" y="696" font-size="17" font-weight="400" fill="#15263f">logs, contracts or chain data.</text><text x="1760" y="754" font-size="16" font-weight="400" fill="#53667d">DMZ placement does not</text><text x="1760" y="777" font-size="16" font-weight="400" fill="#53667d">automatically remove PCI scope.</text><text x="88" y="840" font-size="14" font-weight="700" fill="#53667d">P2P: NATIVE TCP / UDP</text><text x="88" y="874" font-size="18" font-weight="400" fill="#53667d">No standard TLS</text><text x="88" y="901" font-size="18" font-weight="400" fill="#53667d">interception. No HTTP</text><text x="88" y="928" font-size="18" font-weight="400" fill="#53667d">WAF coverage.</text><text x="380" y="840" font-size="14" font-weight="700" fill="#53667d">SESSION INITIATION</text><text x="380" y="874" font-size="17" font-weight="400" fill="#53667d">Blue: node → public peer. Dashed:</text><text x="380" y="900" font-size="17" font-weight="400" fill="#53667d">matching replies; never a new</text><text x="380" y="926" font-size="17" font-weight="400" fill="#53667d">inbound session.</text><text x="380" y="1002" font-size="17" font-weight="400" fill="#b83e4d">GAP: opaque P2P has no payload DLP.</text><text x="380" y="1028" font-size="17" font-weight="400" fill="#b83e4d">Private RPC inspection does not close</text><text x="380" y="1054" font-size="17" font-weight="400" fill="#b83e4d">this exfil path. [2]</text><text x="1040" y="849" font-size="16" font-weight="400" fill="#53667d">Host-local RPC</text><text x="1040" y="873" font-size="16" font-weight="400" fill="#53667d">Never public</text><rect x="792" y="900" width="420" height="180" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="793" y="922" width="4" height="136" rx="2" fill="#087f78" stroke="#087f78" stroke-width="1.5"/><text x="816" y="930" font-size="13" font-weight="700" fill="#087f78">NODE-LOCAL PROXY / SIDECAR</text><text x="816" y="962" font-size="23" font-weight="700" fill="#15263f">Private node TLS endpoint</text><text x="816" y="995" font-size="18" font-weight="400" fill="#15263f">Accept only the private policy tier.</text><text x="816" y="1025" font-size="18" font-weight="400" fill="#15263f">Forward to local RPC; restrict methods.</text><text x="816" y="1055" font-size="16" font-weight="400" fill="#53667d">Engine API / admin / metrics stay private.</text><rect x="1292" y="880" width="364" height="220" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="1293" y="902" width="4" height="176" rx="2" fill="#2863c7" stroke="#2863c7" stroke-width="1.5"/><text x="1316" y="910" font-size="13" font-weight="700" fill="#2863c7">C2 + C3 / TLS INSPECTION HERE</text><text x="1316" y="942" font-size="23" font-weight="700" fill="#15263f">Palo + RPC policy tier</text><text x="1316" y="974" font-size="17" font-weight="400" fill="#15263f">Palo: TLS decrypt / IPS / re-encrypt.</text><text x="1316" y="1004" font-size="17" font-weight="400" fill="#15263f">RPC gateway: caller / method ACL.</text><text x="1316" y="1034" font-size="17" font-weight="400" fill="#15263f">Validate certificates on both legs.</text><text x="1316" y="1064" font-size="17" font-weight="400" fill="#15263f">Fail closed; no raw RPC bypass.</text><rect x="1736" y="900" width="336" height="180" rx="18" fill="white" stroke="#d7e0e9" stroke-width="1.5"/><rect x="1737" y="922" width="4" height="136" rx="2" fill="#2863c7" stroke="#2863c7" stroke-width="1.5"/><text x="1760" y="930" font-size="13" font-weight="700" fill="#2863c7">INITIATES PRIVATE HTTPS / 443</text><text x="1760" y="962" font-size="23" font-weight="700" fill="#15263f">Internal application</text><text x="1760" y="995" font-size="18" font-weight="400" fill="#15263f">Approved workload identity.</text><text x="1760" y="1025" font-size="18" font-weight="400" fill="#15263f">Validates RPC responses.</text><text x="1760" y="1055" font-size="16" font-weight="400" fill="#53667d">Signing keys isolated from nodes.</text><text x="816" y="1132" font-size="17" font-weight="700" fill="#087f78">TLS B: policy tier → node endpoint</text><text x="1316" y="1132" font-size="16" font-weight="400" fill="#53667d">Responses use the same boundary.</text><text x="1760" y="1132" font-size="17" font-weight="700" fill="#2863c7">TLS A: app → policy tier</text><rect x="64" y="1200" width="660" height="294" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.5"/><text x="90" y="1238" font-size="16" font-weight="700" fill="#53667d">01 / PACKET CONTRACT</text><rect x="750" y="1200" width="660" height="294" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.5"/><text x="776" y="1238" font-size="16" font-weight="700" fill="#53667d">02 / OPERATING CONTROLS</text><rect x="1436" y="1200" width="660" height="294" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.5"/><text x="1462" y="1238" font-size="16" font-weight="700" fill="#53667d">03 / DESIGN ACCEPTANCE</text><text x="90" y="1277" font-size="17" font-weight="700" fill="#15263f">Internet ingress</text><text x="90" y="1302" font-size="16" font-weight="400" fill="#53667d">Deny new sessions. No public node VIP / DNAT.</text><text x="90" y="1342" font-size="17" font-weight="700" fill="#15263f">Peer egress</text><text x="90" y="1367" font-size="16" font-weight="400" fill="#53667d">Approve actual discovery / peer destinations and ports.</text><text x="90" y="1407" font-size="17" font-weight="700" fill="#15263f">State tracking</text><text x="90" y="1432" font-size="16" font-weight="400" fill="#53667d">Replies only; no broad inbound ephemeral-port rule.</text><text x="776" y="1277" font-size="17" font-weight="700" fill="#15263f">Controlled support</text><text x="776" y="1302" font-size="16" font-weight="400" fill="#53667d">MFA-admin via separate private path; approved DNS / time / updates.</text><text x="776" y="1342" font-size="17" font-weight="700" fill="#15263f">C6 / Evidence + detection</text><text x="776" y="1367" font-size="16" font-weight="400" fill="#53667d">FW / IPS / RPC / EDR logs → SIEM; monitor peer and resource limits.</text><text x="776" y="1407" font-size="17" font-weight="700" fill="#15263f">C4 / Host containment</text><text x="776" y="1432" font-size="16" font-weight="400" fill="#53667d">EDR + patching; minimal IAM; no payment keys or sensitive business data.</text><text x="1462" y="1277" font-size="17" font-weight="700" fill="#15263f">Client feasibility — not yet proven</text><text x="1462" y="1302" font-size="16" font-weight="400" fill="#53667d">Verify Base outbound-only support, cold sync, steady sync and peer-loss</text><text x="1462" y="1325" font-size="16" font-weight="400" fill="#53667d">recovery.</text><text x="1462" y="1365" font-size="17" font-weight="700" fill="#15263f">Enforcement evidence</text><text x="1462" y="1390" font-size="16" font-weight="400" fill="#53667d">Test segmentation, fail-closed inspection and symmetric SNAT return paths.</text><text x="1462" y="1430" font-size="17" font-weight="700" fill="#15263f">PCI scope</text><text x="1462" y="1455" font-size="16" font-weight="400" fill="#53667d">Connected / security-impacting components may remain in scope. [4]</text><text x="64" y="1515" font-size="17" font-weight="400" fill="#53667d">Solid arrows = session initiator. Dashed packet arrows = stateful replies. Short dashed vertical line = protection association.</text><text x="64" y="1548" font-size="17" font-weight="400" fill="#53667d">Logical reference design, not deployed topology or PCI attestation. TLS inspection is the requested design choice, not a universal PCI mandate.</text><text x="64" y="1578" font-size="16" font-weight="400" fill="#53667d">Controls C1–C6 map to the companion risk register. Sources [1]–[4] and design assumptions are in the README.</text></g></svg>