<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1600" viewBox="0 0 2160 1600" role="img" aria-labelledby="title desc"><title id="title">Blockchain DMZ risk register and control coverage</title><desc id="desc">Eight open risks linked to controls C1 through C6 in both proposed DMZ diagrams. Opaque P2P exfiltration and node-result integrity are explicit residual gaps.</desc><defs><marker id="2863c7" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#2863c7"/></marker><marker id="087f78" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#087f78"/></marker><marker id="53667d" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#53667d"/></marker><marker id="b83e4d" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#b83e4d"/></marker></defs><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="2160" height="1600" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1.5"/><rect x="64" y="372" width="2032" height="128" rx="0" fill="#ffffff" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="500" width="2032" height="128" rx="0" fill="#f0f4f9" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="628" width="2032" height="128" rx="0" fill="#ffffff" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="756" width="2032" height="128" rx="0" fill="#f0f4f9" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="884" width="2032" height="128" rx="0" fill="#ffffff" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="1012" width="2032" height="128" rx="0" fill="#f0f4f9" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="1140" width="2032" height="128" rx="0" fill="#ffffff" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="1268" width="2032" height="128" rx="0" fill="#f0f4f9" stroke="#dce3eb" stroke-width="1"/><rect x="64" y="57" width="6" height="118" rx="3" fill="#2863c7" stroke="#2863c7" stroke-width="1.5"/><text x="90" y="77" font-size="16" font-weight="700" fill="#53667d">NETWORK SECURITY / BLOCKCHAIN DMZ / REVISION 2</text><text x="88" y="133" font-size="46" font-weight="700" fill="#15263f">Risk register &amp; control coverage</text><text x="90" y="171" font-size="21" font-weight="400" fill="#53667d">Eight risks. Explicit control limits. Applies to the two proposed DMZ diagrams—not an implementation attestation.</text><rect x="1790" y="60" width="298.03125" height="30" rx="15" fill="#fff0e9" stroke="#fff0e9" stroke-width="1.5"/><text x="1804" y="80" font-size="14" font-weight="700" fill="#946212">ALL ITEMS OPEN / NOT VALIDATED</text><rect x="64" y="208" width="2032" height="78" rx="18" fill="#15263f" stroke="#15263f" stroke-width="1.5"/><text x="90" y="240" font-size="14" font-weight="700" fill="#9eb6d4">KEY LIMIT</text><text x="90" y="270" font-size="23" font-weight="700" fill="white">Private-leg TLS inspection does not provide public-P2P payload DLP or prove that RPC responses are truthful.</text><rect x="64" y="312" width="2032" height="60" rx="10" fill="#e5ebf4" stroke="#e5ebf4" stroke-width="1.5"/><text x="82" y="349" font-size="14" font-weight="700" fill="#53667d">ID</text><text x="172" y="349" font-size="14" font-weight="700" fill="#53667d">RISK / APPLICABILITY</text><text x="522" y="349" font-size="14" font-weight="700" fill="#53667d">WHAT THE CONTROLS COVER</text><text x="1182" y="349" font-size="14" font-weight="700" fill="#53667d">WHAT REMAINS EXPOSED</text><text x="1782" y="349" font-size="14" font-weight="700" fill="#53667d">PROPOSED OWNER / STATE</text><text x="82" y="409" font-size="24" font-weight="700" fill="#2863c7">R1</text><text x="172" y="404" font-size="21" font-weight="700" fill="#15263f">Node process / host</text><text x="172" y="431" font-size="21" font-weight="700" fill="#15263f">takeover</text><text x="172" y="475" font-size="15" font-weight="400" fill="#53667d">A + B · C1, C4, C6</text><text x="522" y="403" font-size="18" font-weight="400" fill="#15263f">L4 limits exposed services; patching, hardened hosts and EDR</text><text x="522" y="428" font-size="18" font-weight="400" fill="#15263f">reduce or detect compromise. SIEM supports response.</text><text x="1182" y="403" font-size="18" font-weight="400" fill="#53667d">No decrypted P2P exploit coverage is credited. Malicious input</text><text x="1182" y="428" font-size="18" font-weight="400" fill="#53667d">still reaches the client over allowed sessions; EDR can miss it.</text><text x="1782" y="403" font-size="18" font-weight="700" fill="#15263f">Endpoint + SecOps</text><text x="1782" y="431" font-size="16" font-weight="400" fill="#53667d">NetSec supports</text><text x="1782" y="468" font-size="16" font-weight="700" fill="#53667d">Partial / open</text><text x="82" y="537" font-size="24" font-weight="700" fill="#2863c7">R2</text><text x="172" y="532" font-size="21" font-weight="700" fill="#15263f">Exfiltration over allowed</text><text x="172" y="559" font-size="21" font-weight="700" fill="#15263f">P2P</text><text x="172" y="603" font-size="15" font-weight="400" fill="#53667d">A + B · C1, C3, C4, C5</text><text x="522" y="531" font-size="18" font-weight="400" fill="#15263f">Keep sensitive inputs, signing keys and broad credentials off nodes.</text><text x="522" y="556" font-size="18" font-weight="400" fill="#15263f">Narrow RPC data contract and IAM limit what can be read.</text><text x="1182" y="531" font-size="18" font-weight="400" fill="#b83e4d">No guaranteed content-based prevention on opaque public</text><text x="1182" y="556" font-size="18" font-weight="400" fill="#b83e4d">P2P. Data readable by a compromised node may leave;</text><text x="1182" y="581" font-size="18" font-weight="400" fill="#b83e4d">outbound-only does not fix it.</text><text x="1782" y="531" font-size="18" font-weight="700" fill="#15263f">Project risk owner</text><text x="1782" y="559" font-size="16" font-weight="400" fill="#53667d">App + Cloud + NetSec</text><text x="1782" y="596" font-size="16" font-weight="700" fill="#b83e4d">Material gap / open</text><text x="82" y="665" font-size="24" font-weight="700" fill="#2863c7">R3</text><text x="172" y="660" font-size="21" font-weight="700" fill="#15263f">Pivot into CDE or cloud</text><text x="172" y="687" font-size="21" font-weight="700" fill="#15263f">services</text><text x="172" y="731" font-size="15" font-weight="400" fill="#53667d">A + B · C1, C2, C4</text><text x="522" y="659" font-size="18" font-weight="400" fill="#15263f">Separate VPC, node-level rules and segmentation deny new</text><text x="522" y="684" font-size="18" font-weight="400" fill="#15263f">node-to-workload sessions. Minimal cloud identity limits API access.</text><text x="1182" y="659" font-size="18" font-weight="400" fill="#53667d">Permitted RPC responses and explicit dependencies remain</text><text x="1182" y="684" font-size="18" font-weight="400" fill="#53667d">attack paths. Cloud IAM exposure must be tested, not inferred</text><text x="1182" y="709" font-size="18" font-weight="400" fill="#53667d">from IP isolation.</text><text x="1782" y="659" font-size="18" font-weight="700" fill="#15263f">NetSec + Cloud IAM</text><text x="1782" y="687" font-size="16" font-weight="400" fill="#53667d">App validates replies</text><text x="1782" y="724" font-size="16" font-weight="700" fill="#53667d">Partial / open</text><text x="82" y="793" font-size="24" font-weight="700" fill="#2863c7">R4</text><text x="172" y="788" font-size="21" font-weight="700" fill="#15263f">RPC abuse or sensitive</text><text x="172" y="815" font-size="21" font-weight="700" fill="#15263f">requests</text><text x="172" y="859" font-size="15" font-weight="400" fill="#53667d">A + B · C2, C3, C5</text><text x="522" y="787" font-size="18" font-weight="400" fill="#15263f">Private Palo decrypts / IPS / re-encrypts. Separate RPC gateway</text><text x="522" y="812" font-size="18" font-weight="400" fill="#15263f">authenticates callers, restricts methods and validates inputs /</text><text x="522" y="837" font-size="18" font-weight="400" fill="#15263f">resource use.</text><text x="1182" y="787" font-size="18" font-weight="400" fill="#53667d">TLS inspection is not business-data authorization. Generic IPS</text><text x="1182" y="812" font-size="18" font-weight="400" fill="#53667d">is not JSON-RPC DLP. Allowed inputs are visible to the node.</text><text x="1782" y="787" font-size="18" font-weight="700" fill="#15263f">App / API platform</text><text x="1782" y="815" font-size="16" font-weight="400" fill="#53667d">NetSec owns Palo</text><text x="1782" y="852" font-size="16" font-weight="700" fill="#53667d">Partial / open</text><text x="82" y="921" font-size="24" font-weight="700" fill="#2863c7">R5</text><text x="172" y="916" font-size="21" font-weight="700" fill="#15263f">False RPC results / peer</text><text x="172" y="943" font-size="21" font-weight="700" fill="#15263f">isolation</text><text x="172" y="987" font-size="15" font-weight="400" fill="#53667d">A + B · C4, C5, C6</text><text x="522" y="915" font-size="18" font-weight="400" fill="#15263f">Secure transport and monitoring protect the path. Application</text><text x="522" y="940" font-size="18" font-weight="400" fill="#15263f">validation and independent verification are needed for material</text><text x="522" y="965" font-size="18" font-weight="400" fill="#15263f">decisions.</text><text x="1182" y="915" font-size="18" font-weight="400" fill="#b83e4d">A compromised node can lie without changing the blockchain.</text><text x="1182" y="940" font-size="18" font-weight="400" fill="#b83e4d">TLS / IPS cannot certify chain truth; independent checks are</text><text x="1182" y="965" font-size="18" font-weight="400" fill="#b83e4d">not yet specified.</text><text x="1782" y="915" font-size="18" font-weight="700" fill="#15263f">Application owner</text><text x="1782" y="943" font-size="16" font-weight="400" fill="#53667d">Blockchain engineers</text><text x="1782" y="980" font-size="16" font-weight="700" fill="#b83e4d">Not resolved by NSCs</text><text x="82" y="1049" font-size="24" font-weight="700" fill="#2863c7">R6</text><text x="172" y="1044" font-size="21" font-weight="700" fill="#15263f">DDoS, resource</text><text x="172" y="1071" font-size="21" font-weight="700" fill="#15263f">exhaustion, outage</text><text x="172" y="1115" font-size="15" font-weight="400" fill="#53667d">A + B · C1, C3, C4, C6</text><text x="522" y="1043" font-size="18" font-weight="400" fill="#15263f">A: Cloud Armor advanced network DDoS protects supported edge</text><text x="522" y="1068" font-size="18" font-weight="400" fill="#15263f">IPs. Both: connection / peer / RPC limits, capacity alerts and</text><text x="522" y="1093" font-size="18" font-weight="400" fill="#15263f">recovery controls.</text><text x="1182" y="1043" font-size="18" font-weight="400" fill="#53667d">Network DDoS protection does not stop every</text><text x="1182" y="1068" font-size="18" font-weight="400" fill="#53667d">valid-but-expensive peer request. B removes public listeners,</text><text x="1182" y="1093" font-size="18" font-weight="400" fill="#53667d">not peer-driven exhaustion.</text><text x="1782" y="1043" font-size="18" font-weight="700" fill="#15263f">NetSec + Platform</text><text x="1782" y="1071" font-size="16" font-weight="400" fill="#53667d">SecOps monitors</text><text x="1782" y="1108" font-size="16" font-weight="700" fill="#53667d">Partial / open</text><text x="82" y="1177" font-size="24" font-weight="700" fill="#2863c7">R7</text><text x="172" y="1172" font-size="21" font-weight="700" fill="#15263f">Control bypass / unproven</text><text x="172" y="1199" font-size="21" font-weight="700" fill="#15263f">PCI scope</text><text x="172" y="1243" font-size="15" font-weight="400" fill="#53667d">A + B · C1–C6</text><text x="522" y="1171" font-size="18" font-weight="400" fill="#15263f">Default-deny paths, private endpoints, no bypass routes, fail-closed</text><text x="522" y="1196" font-size="18" font-weight="400" fill="#15263f">inspection and centralized evidence support segmentation testing.</text><text x="1182" y="1171" font-size="18" font-weight="400" fill="#53667d">Misrouting, public IPv6, TLS exclusions or broad rules can</text><text x="1182" y="1196" font-size="18" font-weight="400" fill="#53667d">bypass controls. DMZ is not automatically out of PCI scope.</text><text x="1782" y="1171" font-size="18" font-weight="700" fill="#15263f">NetSec + PCI owner</text><text x="1782" y="1199" font-size="16" font-weight="400" fill="#53667d">Platform implements</text><text x="1782" y="1236" font-size="16" font-weight="700" fill="#53667d">Evidence pending</text><text x="82" y="1305" font-size="24" font-weight="700" fill="#2863c7">R8</text><text x="172" y="1300" font-size="21" font-weight="700" fill="#15263f">Unworkable client / NAT</text><text x="172" y="1327" font-size="21" font-weight="700" fill="#15263f">assumptions</text><text x="172" y="1371" font-size="15" font-weight="400" fill="#53667d">A + B · C1, C6</text><text x="522" y="1299" font-size="18" font-weight="400" fill="#15263f">A: prove per-node publication, NAT symmetry and failover. B: prove</text><text x="522" y="1324" font-size="18" font-weight="400" fill="#15263f">cold sync, steady sync and peer-loss recovery for the exact stack.</text><text x="1182" y="1299" font-size="18" font-weight="400" fill="#53667d">No deployment tests performed. Base outbound-only support</text><text x="1182" y="1324" font-size="18" font-weight="400" fill="#53667d">and exact Cloud Armor / appliance / HA placement remain</text><text x="1182" y="1349" font-size="18" font-weight="400" fill="#53667d">unverified.</text><text x="1782" y="1299" font-size="18" font-weight="700" fill="#15263f">Blockchain + Platform</text><text x="1782" y="1327" font-size="16" font-weight="400" fill="#53667d">NetSec validates path</text><text x="1782" y="1364" font-size="16" font-weight="700" fill="#53667d">Feasibility pending</text><text x="64" y="1442" font-size="18" font-weight="700" fill="#2863c7">C1 Perimeter / segmentation    C2 Private Palo TLS + IPS    C3 RPC identity / method / data policy</text><text x="64" y="1476" font-size="18" font-weight="700" fill="#2863c7">C4 Endpoint / patching / IAM    C5 Data minimization / result validation    C6 DDoS / SIEM / evidence</text><text x="64" y="1520" font-size="18" font-weight="400" fill="#53667d">Recommended starting point: B if the exact stack passes feasibility tests; otherwise A requires a justified public-listener exception.</text><text x="64" y="1551" font-size="17" font-weight="400" fill="#53667d">Role owners are proposed, not assigned. No likelihood scores or residual-risk acceptance are invented; project facts and test evidence are still needed.</text><text x="64" y="1579" font-size="16" font-weight="400" fill="#53667d">28 OCT 2026 · Revised diagrams + source links in README · Risk acceptance belongs to the accountable project / business owner.</text></g></svg>